@if(vehiculo(); as v){
<mat-card class="vehiculo-card" appearance="outlined" (click)="irDetalle.emit(v.id)">
    <div class="contenedor-imagen">
        <img class="img-vehiculo" [src]="v.imagenPrincipalUrl" [alt]="v.modeloNombre">
    </div>
    <mat-card-content class="contenido">
        <h3 class="titulo">{{v.modeloNombre}} {{v.anio}}</h3>
        <div class="caracteristicas">
            <span><mat-icon>speed</mat-icon>{{ formatearNumero(v.kilometraje) }} km</span>
            <span><mat-icon>local_gas_station</mat-icon>{{ etiquetaCombustible[v.tipoCombustible] }}</span>
            <span><mat-icon>settings</mat-icon>{{ etiquetaTransmision[v.tipoTransmision] }}</span>
        </div>
    </mat-card-content>
</mat-card>
}
