<div class="catalogo-container">
    <button mat-stroked-button type="button" class="filtros-toggle"
        [attr.aria-expanded]="filtrosAbiertos()" (click)="filtrosAbiertos.set(!filtrosAbiertos())">
        <mat-icon fontIcon="filter_list"></mat-icon>
        Filtros
        <mat-icon [fontIcon]="filtrosAbiertos() ? 'expand_less' : 'expand_more'"></mat-icon>
    </button>

    <aside class="filtros" [class.filtros--abierto]="filtrosAbiertos()">
        <div class="titulo">
            <mat-icon aria-hidden="false" aria-label="Filtros" fontIcon="filter_list"></mat-icon>
            <p>Filtros</p>
        </div>
        <app-filtros [marcas]="marcas()" [modelos]="modelos()" [combustibles]="combustibles()"
            [transmisiones]="transmisiones()" (filtrosChange)="onFiltrar($event)" />
    </aside>

    <section class="catalogo-main">
        <div class="catalogo-header">
            <p class="catalogo">Catalogo</p>
            <h1>Vehiculos disponibles</h1>
            <p class="encontrados">{{vehiculos()?.totalElements}} vehiculos encontrados</p>
        </div>

        @if (vehiculos() === null) {
        <div class="catalogo-cargando">
            <mat-progress-spinner mode="indeterminate" [diameter]="80" />
        </div>
        } @else if ((vehiculos()?.totalElements ?? 0) > 0) {
        <div class="catalogo-body">
            <div class="grilla-vehiculos">
                @for (v of vehiculosList(); track v.id) {
                <app-vehiculo-card [vehiculo]="v" (irDetalle)="irDetalle(v.id)" />
                }
            </div>

            <mat-paginator
            [length]="vehiculos()?.totalElements ?? 0"
            [pageIndex]="pageIndex()"
            [pageSize]="pageSize()"
            [pageSizeOptions]="pageSizeOptions"
            showFirstLastButtons aria-label="Seleccionar página"
            (page)="onPagina($event)"
            />
        </div>
        } @else {
        <p>No se encontraron resultados para su búsqueda.</p>
        }
    </section>
</div>
